name: Build Travel Diary APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TravelDiaryMemories.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          test -f TravelDiaryMemories.zip
          mkdir -p buildsrc
          unzip -q TravelDiaryMemories.zip -d buildsrc
      - name: Build debug APK
        working-directory: buildsrc/TravelDiaryMemories
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-diary-memories-debug-apk
          path: buildsrc/TravelDiaryMemories/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
